# Фрагмент server {} для pharmconsilium.by (SPA + статика)
# Включить в основной nginx.conf или sites-available/pharmconsilium.by

server {
    listen 443 ssl http2;
    server_name pharmconsilium.by www.pharmconsilium.by;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/pharmconsilium;
    index index.html;

    # www → apex (опционально)
    if ($host = www.pharmconsilium.by) {
        return 301 https://pharmconsilium.by$request_uri;
    }

    # Статика с кешем
    location ~* \.(css|js|jsx|png|jpg|jpeg|gif|webp|svg|ico|woff2|woff|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Печать — noindex в HTML; можно не отдавать в поиске
    location = /print.html {
        try_files $uri =404;
    }

    # llms.txt, robots, sitemap
    location ~ ^/(llms\.txt|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
    }

    # SPA fallback — все маршруты приложения
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Пример 301 со старого hash-сайта (настроить под фактические URL)
    # location ~ ^/#(.*)$ { return 301 https://pharmconsilium.by/$1; }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name pharmconsilium.by www.pharmconsilium.by;
    return 301 https://pharmconsilium.by$request_uri;
}
