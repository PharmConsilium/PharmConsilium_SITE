# Фрагмент server {} для pharmconsilium.com (SPA + 301 со старого сайта)

server {
    listen 443 ssl http2;
    server_name pharmconsilium.com www.pharmconsilium.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/pharmconsilium;
    index index.html;

    if ($host = www.pharmconsilium.com) {
        return 301 https://pharmconsilium.com$request_uri;
    }

    include /etc/nginx/snippets/pharmconsilium-old-redirects.conf; # deploy/redirects-old-site.conf

    # SEO-spam (GSC junk) — 410 before SPA try_files
    # Live examples: /?p=, /ctg/..., /guide/..., /f/..., /c=123, /index.php/iqr/...
    if ($args ~* "(^|&)(p|page_id|attachment_id)=") { return 410; }
    location ^~ /ctg/ { return 410; }
    location ^~ /guide/ { return 410; }
    location ^~ /f/ { return 410; }
    location ~ ^/c= { return 410; }
    location ~ ^/p= { return 410; }
    location ~ ^/index\.php/ { return 410; }
    location ^~ /wp-admin { return 410; }
    location ^~ /wp-content { return 410; }
    location ^~ /wp-includes { return 410; }
    location = /xmlrpc.php { return 410; }

    location ~* \.(css|js|jsx|png|jpg|jpeg|gif|webp|svg|ico|woff2|woff|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /print.html {
        try_files $uri =404;
    }

    location ~ ^/(llms\.txt|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name pharmconsilium.com www.pharmconsilium.com;
    return 301 https://pharmconsilium.com$request_uri;
}

# pharmconsilium.by → .com (если домен подключён)
server {
    listen 443 ssl http2;
    server_name pharmconsilium.by www.pharmconsilium.by;
    return 301 https://pharmconsilium.com$request_uri;
}

server {
    listen 80;
    server_name pharmconsilium.by www.pharmconsilium.by;
    return 301 https://pharmconsilium.com$request_uri;
}
