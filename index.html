<script>
window.PHARM_CACHE_BUST = '20260601';
window.PHARM_HIDE_TWEAKS = !/localhost|127\.0\.0\.1/i.test(location.hostname)
  && location.search.indexOf('tweaks') < 0;

(function pharmLoader() {
  var v = window.PHARM_CACHE_BUST;
  var host = location.hostname || '';
  var devJsx = /(?:\?|&)devjsx(?:=|&|$)/.test(location.search);
  var forceBundle = /(?:\?|&)bundle(?:=|&|$)/.test(location.search);
  var isLocal = /^(localhost|127\.0\.0\.1)$/i.test(host) || location.protocol === 'file:';
  var useBundle = forceBundle || (!isLocal && !devJsx);

  function showBootError(msg) {
    var root = document.getElementById('root');
    if (!root || root.childNodes.length) return;
    root.innerHTML = '<div style="max-width:520px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif">'
      + '<p style="font-weight:600;margin:0 0 8px">Не удалось загрузить сайт</p>'
      + '<p style="margin:0 0 12px;color:#5a6273;font-size:14px;line-height:1.5">' + msg + '</p>'
      + '<p style="margin:0;font-size:13px"><a href="?devjsx">Перезагрузить в режиме разработки</a></p></div>';
  }

  function append(src, onload, onerror) {
    var s = document.createElement('script');
    s.src = src;
    if (onload) s.onload = onload;
    if (onerror) s.onerror = onerror;
    document.body.appendChild(s);
  }

  function loadDeferredHelper(next) {
    append('js/pharm-deferred.js?v=' + v, next, function () {
      console.error('[pharm] pharm-deferred.js failed');
      if (next) next();
    });
  }

  function loadBabelBoot() {
    if (!window.React || !window.ReactDOM) {
      showBootError('Не загрузился React с CDN (unpkg.com). Проверьте интернет или откройте сайт через локальный сервер, не file://');
      return;
    }
    append('https://unpkg.com/@babel/standalone@7.26.9/babel.min.js', function () {
      loadDeferredHelper(function () {
        append('js/pharm-boot.js?v=' + v, null, function () {
          showBootError('Не найден js/pharm-boot.js. Запустите сайт из корня проекта через Live Server или scripts/serve.ps1');
        });
      });
    }, function () {
      showBootError('Не загрузился Babel с CDN. Добавьте ?devjsx или выполните npm run build:js для production-бандла.');
    });
  }

  function tryBundle() {
    fetch('js/pharm-bundle.min.js?v=' + v, { method: 'HEAD' })
      .then(function (res) {
        var ok = res.ok && (res.headers.get('content-type') || '').indexOf('javascript') >= 0;
        if (!ok) {
          loadBabelBoot();
          return;
        }
        append('js/pharm-bundle.min.js?v=' + v, null, function () {
          loadBabelBoot();
        });
      })
      .catch(function () { loadBabelBoot(); });
  }

  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && !root.childNodes.length && !window.__pharmReactRoot) {
      showBootError('Загрузка занимает слишком долго. Откройте консоль (F12) или попробуйте <a href="?devjsx">?devjsx</a>.');
    }
  }, 12000);

  if (!window.React || !window.ReactDOM) {
    showBootError('React не загрузился. Проверьте доступ к unpkg.com.');
    return;
  }

  if (useBundle) tryBundle();
  else loadBabelBoot();
})();
</script>
